<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🐉 Dragon Game</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101828;font-family:Arial,sans-serif}body{touch-action:none}#game{display:block;width:100%;height:100%;background:linear-gradient(#75c9ff,#dff6ff)}#ui{position:fixed;top:12px;left:0;right:0;text-align:center;color:#fff;font-weight:800;font-size:26px;text-shadow:0 2px 4px #000;pointer-events:none}.menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,12,25,.35)}.card{width:min(90%,380px);padding:26px;border-radius:22px;background:rgba(15,23,42,.94);color:#fff;text-align:center;box-shadow:0 15px 50px #0008}button{border:0;border-radius:14px;padding:14px 24px;font-size:18px;font-weight:800;background:#22c55e;color:#fff}small{opacity:.75}.hidden{display:none!important}</style>
</head><body>
<canvas id="game"></canvas><div id="ui">0</div>
<div id="menu" class="menu"><div class="card"><h1>🐉 Dragon Game</h1><p>Натискай на екран, щоб дракон летів угору.</p><p><small>Пролітай між перешкодами та набирай очки.</small></p><button id="start">Грати</button><p id="result"></p></div></div>
<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();}
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),ui=document.getElementById('ui'),menu=document.getElementById('menu'),startBtn=document.getElementById('start'),result=document.getElementById('result');let W,H,dpr,dragon,obs,score,running,last,spawnTimer,gameStart;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function reset(){dragon={x:Math.max(70,W*.2),y:H*.45,vy:0,r:20};obs=[];score=0;spawnTimer=0;gameStart=Date.now();running=true;menu.classList.add('hidden');ui.textContent='0';last=performance.now();requestAnimationFrame(loop)}
function flap(){if(running)dragon.vy=-7.5}addEventListener('pointerdown',()=>{if(running)flap()});addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();flap()}});startBtn.onclick=reset;
function spawn(){const gap=Math.max(145,H*.25),margin=70,top=margin+Math.random()*(Math.max(30,H-gap-margin*2));obs.push({x:W+40,w:65,top,gap,passed:false})}
function hit(o){return dragon.x+dragon.r>o.x&&dragon.x-dragon.r<o.x+o.w&&(dragon.y-dragon.r<o.top||dragon.y+dragon.r>o.top+o.gap)}
function end(){running=false;const duration=Math.max(1,(Date.now()-gameStart)/1000);result.innerHTML=`Результат: <b>${score}</b><br>Перевірка нагороди...`;startBtn.textContent='Грати ще';menu.classList.remove('hidden');sendResult(score,duration)}
async function sendResult(score,duration){try{const r=await fetch('/api/dragon/finish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg?.initData||'',score,duration})});const data=await r.json();if(data.ok){result.innerHTML=`Результат: <b>${data.score}</b><br>Нагорода: <b>${data.reward} 🪙</b><br>Рекорд: <b>${data.best_score}</b>`}else{result.innerHTML=`Результат: <b>${score}</b><br>❌ ${data.error||'Нагороду не зараховано'}`}}catch(e){result.innerHTML=`Результат: <b>${score}</b><br>❌ Помилка зв'язку з сервером`}}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#ffffffaa';for(let i=0;i<5;i++){let x=(i*180+(Date.now()/35)%180);ctx.beginPath();ctx.arc(x%W,90+i*55,22,0,Math.PI*2);ctx.arc((x+25)%W,90+i*55,28,0,Math.PI*2);ctx.fill()}for(const o of obs){ctx.fillStyle='#2f855a';ctx.fillRect(o.x,0,o.w,o.top);ctx.fillRect(o.x,o.top+o.gap,o.w,H);ctx.fillStyle='#276749';ctx.fillRect(o.x-5,o.top-12,o.w+10,12);ctx.fillRect(o.x-5,o.top+o.gap,o.w+10,12)}ctx.font='38px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🐉',dragon.x,dragon.y)}
function loop(t){if(!running)return;const dt=Math.min((t-last)/16.67,2);last=t;dragon.vy+=.42*dt;dragon.y+=dragon.vy*dt;spawnTimer+=dt;if(spawnTimer>95){spawn();spawnTimer=0}for(const o of obs){o.x-=3.2*dt;if(!o.passed&&o.x+o.w<dragon.x){o.passed=true;score++;ui.textContent=score}if(hit(o)){draw();end();return}}obs=obs.filter(o=>o.x>-100);if(dragon.y-dragon.r<0||dragon.y+dragon.r>H){draw();end();return}draw();requestAnimationFrame(loop)}
</script></body></html>
