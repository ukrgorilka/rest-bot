<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Ня — Мини-игры</title><script src="https://telegram.org/js/telegram-web-app.js"></script><link rel="stylesheet" href="/minigames/style.css"></head><body><div id="app"><header><button id="back" class="back hidden">‹</button><h1 id="title">🎮 Мини-игры</h1><div class="musicBox"><button id="musicToggle" class="music">🔇</button><button id="musicSelectBtn" class="music">🎵</button></div></header><audio id="bgMusic" src="/api/music" loop preload="auto"></audio><main>
<section id="games" class="screen"><div class="subtitle">Выбирай игру и зарабатывай 🪙</div><button id="openMines" class="card"><span class="icon">💣</span><span><b>Сапёр</b><small>Классический сапёр с наградой</small></span><span>›</span></button><button id="openSnake" class="card"><span class="icon">🐍</span><span><b>Змейка</b><small>Ешь яблоки — получай 🪙</small></span><span>›</span></button><button id="open2048" class="card"><span class="icon">🧱</span><span><b>2048</b><small>Собери большие плитки</small></span><span>›</span></button><button id="openReaction" class="card"><span class="icon">⚡</span><span><b>Реакция</b><small>Нажми как можно быстрее</small></span><span>›</span></button><button id="openTarget" class="card"><span class="icon">🎯</span><span><b>Тир</b><small>Попади по целям за время</small></span><span>›</span></button><button id="openRecords" class="card"><span class="icon">🏆</span><span><b>Мои рекорды</b><small>Лучшие результаты мини-игр</small></span><span>›</span></button><button id="openProfile" class="card"><span class="icon">👤</span><span><b>Профиль</b><small>Баланс, XP и уровень</small></span><span>›</span></button><button id="openLeaderboard" class="card"><span class="icon">🏆</span><span><b>Рейтинг</b><small>Топ игроков Mini App</small></span><span>›</span></button><button id="openDaily" class="card"><span class="icon">🎁</span><span><b>Ежедневный бонус</b><small>Забирай награду каждый день</small></span><span>›</span></button><button id="openQuests" class="card"><span class="icon">📋</span><span><b>Ежедневные задания</b><small>Выполняй квесты и получай 🪙</small></span><span>›</span></button></section>
<section id="difficulty" class="screen hidden"><p id="difficultyHint" class="hint"></p><div id="levels"></div></section>
<section id="game" class="screen hidden"><div id="mineControls" class="controls hidden"><button id="digMode" class="mode active">⛏ Копать</button><button id="flagMode" class="mode">🚩 Флажок</button></div><div id="gameStats" class="stats"><span id="stat1">💣 <b id="minesLeft">0</b></span><span id="stat2">⏱ <b id="timer">0</b></span><span id="stat3">💰 <b id="reward">0</b></span></div><div id="boardWrap"><div id="board"></div></div><div id="snakeControls" class="snake-controls hidden"><button data-dir="up">⬆️</button><div><button data-dir="left">⬅️</button><button data-dir="down">⬇️</button><button data-dir="right">➡️</button></div></div><div id="reactionArea" class="reaction hidden"><button id="reactionButton">ЖДИ...</button></div><div id="targetArea" class="target-area hidden"><div id="targetField"></div></div><p id="result"></p><button id="newGame" class="primary">🔄 Новая игра</button></section>
<section id="records" class="screen hidden"><div id="recordsList" class="records"></div></section>
<section id="profile" class="screen hidden"><div id="profileBox" class="profile"></div></section>
<section id="leaderboard" class="screen hidden"><div id="leaderboardList" class="records"></div></section>
<section id="daily" class="screen hidden"><div id="dailyBox" class="daily"></div><button id="claimDaily" class="primary">🎁 Забрать бонус</button></section>
<section id="quests" class="screen hidden"><div id="questsList" class="records"></div></section>
<div id="musicPanel" class="music-panel hidden"><div class="music-title">🎵 Музыка</div><div id="musicList"></div></div>
</main></div><script src="/minigames/app.js"></script></body></html>
